# TE2 Enhanced / PbiBench CI on the owner's local Windows runner (shell executor, PowerShell).
# The private GitLab project is a CI mirror; the public source of truth is GitHub.
# The runner needs VS MSBuild 17.x, .NET Framework 4.8 reference assemblies and a stable
# system .NET SDK for legacy imports. The canonical net10 SDK and NuGet are taken from
# PBIBENCH_DOTNET / PBIBENCH_NUGET when present, otherwise installed privately into the
# runner cache (never globally).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH =~ /^(claude\/pbibench-|codex\/pro-ai-)/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  GIT_DEPTH: "20"
  PBIBENCH_DOTNET: "D:/PROJ/TabularEditor_J/.tools/dotnet/dotnet.exe"
  PBIBENCH_NUGET: "D:/PROJ/TabularEditor_J/.tools/nuget.exe"
  PBIBENCH_TOOL_CACHE: "C:/GitLab-Runner/cache/pbibench-tools"
  # LocalSystem's profile is under system32; the 32-bit VS MSBuild is WOW64-redirected away from it,
  # so restore and build must share a package folder outside the system profile.
  NUGET_PACKAGES: "C:/GitLab-Runner/cache/nuget-packages"

default:
  tags: [local-windows]
  interruptible: true

stages: [verify]

.tools: &tools
  - $ErrorActionPreference = 'Stop'
  - |
    if (!(Test-Path $env:PBIBENCH_DOTNET)) {
      $env:PBIBENCH_DOTNET = Join-Path $env:PBIBENCH_TOOL_CACHE 'dotnet/dotnet.exe'
      if (!(Test-Path $env:PBIBENCH_DOTNET)) {
        New-Item -ItemType Directory -Force $env:PBIBENCH_TOOL_CACHE | Out-Null
        $installer = Join-Path $env:PBIBENCH_TOOL_CACHE 'dotnet-install.ps1'
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
        & $installer -Version 10.0.401 -InstallDir (Join-Path $env:PBIBENCH_TOOL_CACHE 'dotnet') -NoPath
      }
    }
    if (!(Test-Path $env:PBIBENCH_NUGET)) {
      $env:PBIBENCH_NUGET = Join-Path $env:PBIBENCH_TOOL_CACHE 'nuget.exe'
      if (!(Test-Path $env:PBIBENCH_NUGET)) {
        New-Item -ItemType Directory -Force $env:PBIBENCH_TOOL_CACHE | Out-Null
        Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/v6.11.1/nuget.exe -OutFile $env:PBIBENCH_NUGET
      }
    }
    & $env:PBIBENCH_DOTNET --version

verify:
  stage: verify
  timeout: 45m
  script:
    - *tools
    - git rev-parse HEAD | Tee-Object -FilePath ci-head.txt
    - powershell -NoProfile -ExecutionPolicy Bypass -File Scripts/Verify-PbiBench.ps1 -DotNetPath $env:PBIBENCH_DOTNET -NuGetPath $env:PBIBENCH_NUGET -EvidenceDirectory "$env:CI_PROJECT_DIR/ci-evidence"
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # Portable qualification package from the verified tree, then self-test the packaged companion
    # on the runner's installed .NET runtime (not the private SDK).
    - powershell -NoProfile -ExecutionPolicy Bypass -File Scripts/ci/Package-PbiBench.ps1 -OutDirectory "$env:CI_PROJECT_DIR/dist" -DotNetPath $env:PBIBENCH_DOTNET
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
    - Expand-Archive $zip.FullName dist/unpacked -Force
    - "& dist/unpacked/mcp/TE2Enhanced.Mcp.exe --self-test; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
    - Remove-Item -Recurse -Force dist/unpacked
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-evidence/
      - ci-head.txt
      - dist/
